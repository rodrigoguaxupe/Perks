  :root{
    --ink:#1B2430;
    --ink-soft:#3B4656;
    --paper:#FAF7F0;
    --paper-dim:#F1ECE0;
    --line:#DAD3C2;
    --brass:#A9803F;
    --brass-deep:#8A6A32;
    --rust:#AE4A38;
    --sage:#4F7355;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Mono', monospace;
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{
    font-family:'Fraunces', serif;
    color:var(--ink);
    margin:0;
  }
  a{color:var(--brass-deep);}
  button{font-family:inherit;}
  #app{max-width:760px;margin:0 auto;padding:28px 20px 120px;}

  /* ---- Hero ---- */
  .hero{padding:8px 0 32px;border-bottom:1px solid var(--line);margin-bottom:32px;}

  .fab-add{
    position:fixed;top:18px;right:18px;width:44px;height:44px;border-radius:50%;
    background:var(--ink);color:var(--paper);border:none;font-family:'Space Mono',monospace;
    font-size:26px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(27,36,48,.25);
    z-index:50;display:flex;align-items:center;justify-content:center;transition:transform .15s ease, background .15s ease;
  }
  .fab-add:hover{background:var(--ink-soft);}
  .fab-add.open{background:var(--rust);transform:rotate(45deg);}
  .hero h1{font-size:34px;font-weight:600;letter-spacing:-0.01em;}
  .hero .lede{max-width:52ch;color:var(--ink-soft);margin-top:10px;font-size:14.5px;}
  .hero-stats{display:flex;gap:28px;margin-top:24px;flex-wrap:wrap;}
  .stat .num{font-family:'Fraunces',serif;font-size:28px;font-weight:600;}
  .stat .label{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .stat.warn .num{color:var(--rust);}
  .stat.good .num{color:var(--sage);}

  /* ---- Add panel ---- */
  .add-panel{background:var(--paper-dim);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:36px;}
  .add-panel h2{font-size:19px;margin-bottom:4px;}
  .add-panel .hint{color:var(--ink-soft);font-size:13px;margin-bottom:14px;}
  .add-row{display:flex;gap:8px;flex-wrap:wrap;}
  .add-row input[type=text]{
    flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;
    background:var(--paper);font-family:inherit;font-size:14.5px;color:var(--ink);
  }
  .add-row select{padding:10px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-family:inherit;font-size:14.5px;}
  .btn{
    padding:10px 16px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
    font-family:inherit;font-size:14px;cursor:pointer;white-space:nowrap;
  }
  .btn:hover{background:var(--ink-soft);}
  .btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn.secondary:hover{border-color:var(--ink);}
  .btn.small{padding:5px 10px;font-size:12.5px;}
  .btn:disabled{opacity:.5;cursor:default;}

  .owner-toggle{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .owner-toggle button{
    padding:10px 14px;border:none;background:var(--paper);font-family:inherit;font-size:13.5px;
    cursor:pointer;color:var(--ink-soft);border-right:1px solid var(--line);
  }
  .owner-toggle button:last-child{border-right:none;}
  .owner-toggle button.active{background:var(--ink);color:var(--paper);}

  .owner-section{margin-bottom:44px;}
  .owner-section-head{display:flex;align-items:baseline;gap:10px;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid var(--ink);}
  .owner-section-head h2{font-family:'Fraunces',serif;font-size:24px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink);}
  .owner-section-head .owner-value{font-size:13px;color:var(--brass-deep);font-weight:600;}
  .owner-section.owner-shared .owner-section-head{border-bottom-color:var(--brass);}
  .owner-section.owner-rodrigo .owner-section-head{border-bottom-color:var(--sage);}
  .owner-section.owner-karina .owner-section-head{border-bottom-color:var(--rust);}
  .add-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:8px;}
  .claude-link{font-size:13px;color:var(--ink-soft);text-decoration:none;border-bottom:1px dashed var(--line);}
  .claude-link:hover{color:var(--brass-deep);border-color:var(--brass-deep);}

  /* ---- Review screen ---- */
  #reviewScreen{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;}
  .review-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
  .review-head h3{font-size:17px;}
  .review-source{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
  .review-item{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;background:var(--paper);}
  .review-item.excluded{opacity:.4;}
  .review-item-top{display:flex;gap:10px;align-items:flex-start;}
  .review-item-top input[type=checkbox]{margin-top:4px;}
  .review-fields{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;}
  .review-fields input, .review-fields select{
    font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--paper);width:100%;
  }
  .review-fields .full{grid-column:1/-1;}
  .field-label{font-size:10.5px;color:var(--ink-soft);display:block;margin-bottom:2px;}
  .loading{color:var(--ink-soft);font-size:13.5px;padding:10px 0;}

  /* ---- Categories ---- */
  .category{margin-bottom:36px;}
  .category h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-family:'Space Mono',monospace;font-weight:600;margin-bottom:12px;}
  .category h2 .count{color:var(--line);font-weight:400;}
  .item-card{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;background:var(--paper);}
  .item-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;gap:10px;}
  .item-head:hover{background:var(--paper-dim);}
  .item-head-left{min-width:0;}
  .item-name{font-family:'Fraunces',serif;font-size:18px;font-weight:600;}
  .item-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .item-head-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .value-tag{font-size:12.5px;color:var(--brass-deep);font-weight:600;}
  .chevron{transition:transform .15s ease;color:var(--ink-soft);}
  .item-card.open .chevron{transform:rotate(90deg);}
  .item-body{display:none;border-top:1px solid var(--line);padding:6px 16px 12px;}
  .item-card.open .item-body{display:block;}

  .benefit-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--paper-dim);align-items:flex-start;}
  .benefit-row:last-child{border-bottom:none;}
  .benefit-row input[type=checkbox]{margin-top:3px;width:16px;height:16px;accent-color:var(--sage);flex-shrink:0;}
  .benefit-main{flex:1;min-width:0;}
  .benefit-name-line{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .benefit-name{font-weight:600;}
  .benefit-value{color:var(--brass-deep);font-weight:600;font-size:13.5px;}
  .benefit-meta{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .benefit-meta .flag{color:var(--rust);}
  .benefit-how{font-size:12.5px;color:var(--ink-soft);margin-top:4px;line-height:1.5;}
  .badge{display:inline-block;font-size:10.5px;padding:2px 6px;border-radius:4px;margin-left:6px;border:1px solid var(--line);color:var(--ink-soft);}
  .badge.needs{color:var(--rust);border-color:var(--rust);}
  .badge.used{color:var(--sage);border-color:var(--sage);}
  .activate-toggle{font-size:11.5px;padding:3px 8px;border-radius:4px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--ink-soft);margin-top:5px;}
  .activate-toggle.on{border-color:var(--sage);color:var(--sage);}

  .item-controls{display:flex;gap:10px;margin-top:6px;}
  .item-controls button{
    background:none;border:none;padding:0;font-family:inherit;font-size:11.5px;color:var(--ink-soft);
    cursor:pointer;text-decoration:underline;
  }
  .item-controls button:hover{color:var(--ink);}
  .switch-btn{
    width:38px;height:22px;border-radius:11px;border:none;cursor:pointer;position:relative;
    background:var(--rust);flex-shrink:0;margin-top:2px;padding:0;transition:background .15s ease;
  }
  .switch-btn.on{background:var(--sage);}
  .switch-btn .knob{
    position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:var(--paper);transition:left .15s ease;box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .switch-btn.on .knob{left:18px;}

    font-family:inherit;font-size:inherit;color:inherit;background:var(--paper-dim);
    border:1px solid var(--line);border-radius:4px;padding:1px 5px;width:auto;
  }
  .inline-edit:focus{outline:none;border-color:var(--brass-deep);background:var(--paper);}
  .fee-edit{width:90px;font-size:12px;}
  .value-edit{width:150px;font-weight:600;color:var(--brass-deep);text-align:right;}

  .item-body-actions{display:flex;gap:14px;padding:10px 0 4px;font-size:12px;}
  .item-body-actions button{background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:0;text-decoration:underline;font-family:inherit;font-size:12px;}
  .item-body-actions button:hover{color:var(--ink);}

  .empty{color:var(--ink-soft);font-size:13.5px;border:1px dashed var(--line);border-radius:8px;padding:16px;text-align:center;}

  @media (max-width:480px){
    .review-fields{grid-template-columns:1fr;}
    .hero-stats{gap:20px;}
  }
</style>

</div>

itemsRef.once('value').then(snap => {
  const existing = snap.val() || {};
  const updates = {};
  Object.entries(SEED).forEach(([key, val]) => {
    if (!existing[key]) updates[key] = val;
  });
  // One-time correction: Chase Sapphire Reserve's fee rose from $550 to $795 in June 2025.
  if (existing.card_csr && existing.card_csr.annualFee !== '$795/yr') {
    updates['card_csr/annualFee'] = '$795/yr';
  }
  if (Object.keys(updates).length) {
    itemsRef.update(updates);
  }
});

/* ====================== HELPERS ====================== */
function fmtMoney(n){ return '$' + Math.round(n).toLocaleString('en-US'); }

function parseAnnualValue(val){
  if(!val) return 0;
  const m = val.match(/\$([\d,]+)/);
  if(!m) return 0;
  return parseInt(m[1].replace(/,/g,''), 10);
}

function currentPeriodKey(benefit, item){
  const now = new Date();
  const y = now.getFullYear();
  switch(benefit.resetPeriod){
    case 'monthly': return `${y}-${String(now.getMonth()+1).padStart(2,'0')}`;
    case 'biannual': return now.getMonth() < 6 ? `${y}-H1` : `${y}-H2`;
    case 'annual_calendar': return `${y}`;
    case 'one_time_year': return `${y}`;
    case 'annual_anniversary': {
      if(!item.anniversaryDate) return `${y}`;
      const [am, ad] = item.anniversaryDate.split('-').map(Number);
      const passed = (now.getMonth()+1 > am) || (now.getMonth()+1 === am && now.getDate() >= ad);
      return passed ? `${y}-anniv` : `${y-1}-anniv`;
    }
    default: return 'ongoing';
  }
}

function periodEndLabel(benefit){
  switch(benefit.resetPeriod){
    case 'monthly': return 'Resets next month';
    case 'biannual': {
      const now = new Date();
      return now.getMonth() < 6 ? 'Resets Jul 1' : 'Resets Jan 1';
    }
    case 'annual_calendar': return 'Resets Jan 1';
    case 'annual_anniversary': return 'Resets on account anniversary';
    case 'one_time_year': return benefit.resetDetail || 'One-time';
    default: return '';
  }
}

/* ====================== RENDER ====================== */
let itemsCache = {};

itemsRef.on('value', snap => {
  itemsCache = snap.val() || {};
  render();
});

function render(){
  let totalValue = 0, unusedCount = 0, totalCount = 0;
  const CAT_LABELS = { card: 'Cards', membership: 'Memberships', utility: 'Utilities and subscriptions' };
  const OWNER_ORDER = ['Rodrigo', 'Karina'];

  Object.values(itemsCache).forEach(item => {
    totalCount++;
    Object.values(item.benefits || {}).forEach(b => {
      if (b.kind !== 'credit') return;
      const base = parseAnnualValue(b.value);
      totalValue += (b.resetPeriod === 'monthly') ? base * 12 : base;
      const key = currentPeriodKey(b, item);
      const used = (b.usedPeriods && b.usedPeriods[key]) || false;
      if (!used) unusedCount++;
    });
  });

  document.getElementById('statValue').textContent = fmtMoney(totalValue);
  document.getElementById('statUnused').textContent = unusedCount;
  document.getElementById('statCount').textContent = totalCount;

  const scrollPos = window.scrollY;
  const container = document.getElementById('ownerSections');
  container.innerHTML = OWNER_ORDER.map(owner => {
    const cats = { card: [], membership: [], utility: [] };
    Object.entries(itemsCache).forEach(([id, item]) => {
      const itemOwner = item.owner || 'Shared';
      if (itemOwner !== owner && itemOwner !== 'Shared') return;
      cats[item.category] = cats[item.category] || [];
      cats[item.category].push([id, item]);
    });
    const catHtml = ['card','membership','utility'].map(cat => {
      const arr = cats[cat] || [];
      if (arr.length === 0) return '';
      return `
        <div class="category">
          <h2>${CAT_LABELS[cat]} <span class="count">(${arr.length})</span></h2>
          <div class="item-list">${arr.map(([id,item]) => renderItem(id,item)).join('')}</div>
        </div>`;
    }).join('');
    const hasItems = Object.values(cats).some(arr => arr.length);
    return `
      <div class="owner-section owner-${owner.toLowerCase()}">
        <div class="owner-section-head"><h2>${owner}</h2></div>
        ${hasItems ? catHtml : `<div class="empty">Nothing here yet.</div>`}
      </div>`;
  }).join('');

  attachItemHandlers();
  window.scrollTo(0, scrollPos);
}

const editItems = new Set();
const showAllItems = new Set();
const openItems = new Set();

function renderItem(id, item){
  const allBenefits = Object.entries(item.benefits || {});
  const annualVal = allBenefits.reduce((sum,[,b])=>{
    if(b.kind!=='credit') return sum;
    const base = parseAnnualValue(b.value);
    return sum + (b.resetPeriod==='monthly' ? base*12 : base);
  },0);

  const editMode = editItems.has(id);
  const showAll = showAllItems.has(id);
  const visibleBenefits = (editMode || showAll) ? allBenefits : allBenefits.filter(([,b]) => b.featured !== false);

  const benefitRows = visibleBenefits.length ? visibleBenefits.map(([bid,b]) => renderBenefit(id,bid,b,item,editMode)).join('') :
    (allBenefits.length ? `<div class="empty">Everything here is hidden. Tap "Edit" to bring benefits back.</div>` :
    `<div class="empty">No benefits added yet. Tap "Add" above, or use the "Ask Claude directly" link to research it first.</div>`);

  const hiddenCount = allBenefits.length - allBenefits.filter(([,b]) => b.featured !== false).length;

  return `
  <div class="item-card ${openItems.has(id) ? 'open' : ''}" data-id="${id}">
    <div class="item-head" data-toggle="${id}">
      <div class="item-head-left">
        <div class="item-name">${item.name}</div>
        <div class="item-sub">${item.owner ? item.owner + ' · ' : ''}${item.provider || ''}${editMode ? ` · <input class="inline-edit fee-edit" data-edit-field="${id}|annualFee" value="${(item.annualFee||'').replace(/"/g,'&quot;')}" placeholder="annual fee">` : (item.annualFee ? ' · ' + item.annualFee : '')}</div>
        <div class="item-controls">
          <button data-edit-toggle="${id}">${editMode ? 'Done editing' : 'Edit'}</button>
          ${hiddenCount > 0 ? `<button data-showall-toggle="${id}">${showAll ? 'Show less' : `Show all (${hiddenCount} hidden)`}</button>` : ''}
        </div>
      </div>
      <div class="item-head-right">
        ${annualVal ? `<span class="value-tag">${fmtMoney(annualVal)}/yr</span>` : ''}
        <span class="chevron">›</span>
      </div>
    </div>
    <div class="item-body">
      ${benefitRows}
      <div class="item-body-actions">
        <button data-delete="${id}">Delete</button>
      </div>
    </div>
  </div>`;
}

function renderBenefit(itemId,bid,b,item,editMode){
  const key = currentPeriodKey(b,item);
  const used = (b.usedPeriods && b.usedPeriods[key]) || false;
  const isCredit = b.kind === 'credit';
  const featured = b.featured !== false;
  return `
  <div class="benefit-row">
    ${editMode ? `<button class="switch-btn ${featured?'on':''}" data-plug="${itemId}|${bid}" title="${featured?'Featured — tap to hide':'Hidden — tap to feature'}"><span class="knob"></span></button>` : ''}
    ${isCredit ? `<input type="checkbox" data-used="${itemId}|${bid}|${key}" ${used?'checked':''}>` : `<span style="width:16px"></span>`}
    <div class="benefit-main">
      <div class="benefit-name-line">
        <span class="benefit-name">${b.name}</span>
        <span class="benefit-value">${editMode ? `<input class="inline-edit value-edit" data-edit-field="${itemId}|${bid}|value" value="${(b.value||'').replace(/"/g,'&quot;')}">` : (b.value || '')}</span>
      </div>
      <div class="benefit-meta">
        ${b.resetDetail || periodEndLabel(b) || ''}
        ${b.activationRequired ? `<span class="badge ${b.activated?'used':'needs'}">${b.activated?'activated':'needs activation'}</span>` : ''}
      </div>
      ${b.howToUse ? `<div class="benefit-how">${b.howToUse}</div>` : ''}
      ${b.notes ? `<div class="benefit-how">${b.notes}</div>` : ''}
      ${b.activationRequired ? `<button class="activate-toggle ${b.activated?'on':''}" data-activate="${itemId}|${bid}">${b.activated?'✓ activated':'mark activated'}</button>` : ''}
    </div>
  </div>`;
}

function attachItemHandlers(){
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick = () => {
      const id = el.dataset.toggle;
      if (openItems.has(id)) openItems.delete(id); else openItems.add(id);
      render();
    };
  });
  document.querySelectorAll('[data-used]').forEach(el=>{
    el.onchange = (e) => {
      const [itemId,bid,key] = el.dataset.used.split('|');
      itemsRef.child(`${itemId}/benefits/${bid}/usedPeriods/${key}`).set(e.target.checked);
    };
  });
  document.querySelectorAll('[data-activate]').forEach(el=>{
    el.onclick = (e) => {
      e.stopPropagation();
      const [itemId,bid] = el.dataset.activate.split('|');
      const current = itemsCache[itemId].benefits[bid].activated;
      itemsRef.child(`${itemId}/benefits/${bid}/activated`).set(!current);
    };
  });
  document.querySelectorAll('[data-edit-field]').forEach(el=>{
    el.onclick = (e) => e.stopPropagation();
    el.onchange = (e) => {
      const parts = el.dataset.editField.split('|');
      if (parts.length === 2) {
        const [itemId, field] = parts;
        itemsRef.child(`${itemId}/${field}`).set(e.target.value);
      } else if (parts.length === 3) {
        const [itemId, bid, field] = parts;
        itemsRef.child(`${itemId}/benefits/${bid}/${field}`).set(e.target.value);
      }
    };
  });
  document.querySelectorAll('[data-plug]').forEach(el=>{
    el.onclick = (e) => {
      e.stopPropagation();
      const [itemId,bid] = el.dataset.plug.split('|');
      const current = itemsCache[itemId].benefits[bid].featured !== false;
      itemsRef.child(`${itemId}/benefits/${bid}/featured`).set(!current);
    };
  });
  document.querySelectorAll('[data-edit-toggle]').forEach(el=>{
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.editToggle;
      if (editItems.has(id)) editItems.delete(id); else editItems.add(id);
      openItems.add(id);
      render();
    };
  });
  document.querySelectorAll('[data-showall-toggle]').forEach(el=>{
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.showallToggle;
      if (showAllItems.has(id)) showAllItems.delete(id); else showAllItems.add(id);
      openItems.add(id);
      render();
    };
  });
  document.querySelectorAll('[data-delete]').forEach(el=>{
    el.onclick = (e) => {
      e.stopPropagation();
      if(confirm('Remove this?')) itemsRef.child(el.dataset.delete).remove();
    };
  });
}

/* ====================== ADD / MANUAL ENTRY FLOW ====================== */
const nameInput = document.getElementById('itemNameInput');
const typeSelect = document.getElementById('itemTypeSelect');
const reviewScreen = document.getElementById('reviewScreen');
const claudeLink = document.getElementById('claudeLink');

const addPanel = document.getElementById('addPanel');
const addToggleBtn = document.getElementById('addToggleBtn');
addToggleBtn.onclick = () => {
  addPanel.hidden = !addPanel.hidden;
  addToggleBtn.classList.toggle('open', !addPanel.hidden);
  if (!addPanel.hidden) nameInput.focus();
};

let selectedOwner = 'Shared';
const ownerToggle = document.getElementById('ownerToggle');
ownerToggle.querySelectorAll('button').forEach(btn => {
  btn.onclick = () => {
    selectedOwner = btn.dataset.owner;
    ownerToggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
  };
});
const ownerSelect = { get value(){ return selectedOwner; }, set value(v){
  selectedOwner = v;
  ownerToggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.owner === v));
}};

function updateClaudeLink(){
  const name = nameInput.value.trim() || "this item";
  const prompt = `Itemize the current, real benefits of "${name}": list each benefit, its dollar value or perk, how often it resets, whether it needs activation, and how to use it. Be specific and current.`;
  claudeLink.href = 'https://claude.ai/new?q=' + encodeURIComponent(prompt);
}
nameInput.addEventListener('input', updateClaudeLink);
updateClaudeLink();

document.getElementById('manualBtn').onclick = () => openManualReview(null);

function showReview(data, name, type, owner, existingId){
  const benefits = data.benefits || [];
  reviewScreen.innerHTML = `
    <div class="review-head"><h3>Review before saving</h3></div>
    ${data.sourceNote ? `<div class="review-source">${data.sourceNote}</div>` : ''}
    <div id="reviewList"></div>
    <div class="add-footer">
      <button class="btn" id="saveReviewBtn">Save</button>
      <button class="btn secondary" id="discardReviewBtn">Discard</button>
    </div>
  `;
  const list = document.getElementById('reviewList');
  list.innerHTML = benefits.map((b,i) => reviewRow(b,i)).join('');

  document.getElementById('discardReviewBtn').onclick = () => { reviewScreen.hidden = true; reviewScreen.innerHTML=''; };
  document.getElementById('saveReviewBtn').onclick = () => saveReview(name, type, owner, data.provider, data.annualFee, existingId);
}

function reviewRow(b, i){
  return `
  <div class="review-item" data-idx="${i}">
    <div class="review-item-top">
      <input type="checkbox" checked data-field="include">
      <div class="review-fields">
        <div class="full"><span class="field-label">Benefit name</span><input data-field="name" value="${(b.name||'').replace(/"/g,'&quot;')}"></div>
        <div><span class="field-label">Value</span><input data-field="value" value="${(b.value||'').replace(/"/g,'&quot;')}"></div>
        <div><span class="field-label">Kind</span>
          <select data-field="kind">
            <option value="credit" ${b.kind==='credit'?'selected':''}>Credit (trackable)</option>
            <option value="perk" ${b.kind==='perk'?'selected':''}>Ongoing perk</option>
          </select>
        </div>
        <div><span class="field-label">Resets</span>
          <select data-field="resetPeriod">
            <option value="monthly" ${b.resetPeriod==='monthly'?'selected':''}>Monthly</option>
            <option value="biannual" ${b.resetPeriod==='biannual'?'selected':''}>Twice a year</option>
            <option value="annual_calendar" ${b.resetPeriod==='annual_calendar'?'selected':''}>Yearly (calendar)</option>
            <option value="annual_anniversary" ${b.resetPeriod==='annual_anniversary'?'selected':''}>Yearly (anniversary)</option>
            <option value="one_time_year" ${b.resetPeriod==='one_time_year'?'selected':''}>One-time / rare</option>
            <option value="ongoing" ${(!b.resetPeriod||b.resetPeriod==='ongoing')?'selected':''}>Ongoing, no reset</option>
          </select>
        </div>
        <div><span class="field-label">Needs activation?</span>
          <select data-field="activationRequired">
            <option value="false" ${!b.activationRequired?'selected':''}>No</option>
            <option value="true" ${b.activationRequired?'selected':''}>Yes</option>
          </select>
        </div>
        <div class="full"><span class="field-label">How to use it</span><input data-field="howToUse" value="${(b.howToUse||'').replace(/"/g,'&quot;')}"></div>
        <div class="full"><span class="field-label">Notes</span><input data-field="notes" value="${(b.notes||'').replace(/"/g,'&quot;')}"></div>
      </div>
    </div>
  </div>`;
}

function saveReview(name, type, owner, provider, annualFee, existingId){
  const rows = document.querySelectorAll('.review-item');
  const benefits = {};
  let n = 1;
  rows.forEach(row => {
    const include = row.querySelector('[data-field=include]').checked;
    if(!include) return;
    const get = f => row.querySelector(`[data-field=${f}]`).value;
    benefits['b'+(n++)] = {
      name: get('name'),
      value: get('value'),
      kind: get('kind'),
      resetPeriod: get('resetPeriod'),
      resetDetail: '',
      activationRequired: get('activationRequired') === 'true',
      activated: false,
      howToUse: get('howToUse'),
      notes: get('notes'),
      featured: true
    };
  });

  const id = existingId || ('item_' + Date.now());
  const payload = {
    name, category: type, owner: owner || 'Shared', provider: provider || '', annualFee: annualFee || null, benefits
  };
  itemsRef.child(id).set(payload).then(()=>{
    reviewScreen.hidden = true;
    reviewScreen.innerHTML = '';
    addPanel.hidden = true;
    addToggleBtn.classList.remove('open');
    nameInput.value = '';
  });
}

function openManualReview(existingId){
  const name = nameInput.value.trim() || 'New item';
  showReview({benefits:[{name:'', value:'', kind:'credit', resetPeriod:'annual_calendar', activationRequired:false, howToUse:'', notes:''}]}, name, typeSelect.value, ownerSelect.value, existingId);
}
